# Maven package Java project Web App to Linux on Azure
# Build your Java project and deploy it to Azure as a Linux web app
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java

trigger:
- main
pool:
  name: Local-pool (On-premise)

variables:

  # Azure Resource Manager connection created during pipeline creation
  azureSubscription: '3d53a9d2-3601-4fff-8045-e3c2e2659f5f'

  # Web app name
  webAppName: 'mglshort'

  # Environment name
  environmentName: 'mglshort'

stages:
- stage: Build
  jobs:
  - job: Build
    steps:
    - script: .\mvnw.cmd -B clean package
      displayName: Build and test

    - publish: '$(System.DefaultWorkingDirectory)\target'
      artifact: drop
      displayName: Publish JAR
      
- stage: Deploy
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployWebApp
    environment: $(environmentName)
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: Deploy to mglshort
            inputs:
              azureSubscription: $(azureSubscription)
              appType: webAppLinux
              appName: $(webAppName)
              package: '$(Pipeline.Workspace)/drop/*.jar'